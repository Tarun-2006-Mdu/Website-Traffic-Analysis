<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Website Traffic Analyzer</title>
    <style>
        body {
            background: url('/static/index2 image.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 120px auto;
            padding: 20px;
            background: rgba(253, 249, 249, 0.7);
            border-radius: 10px;
            text-align: center;
        }
        input[type="file"], button {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
        }
        button {
            background-color: #00c853;
            color: white;
            font-size: 16px;
        }
        button:hover {
            background-color: #009624;
        }
        h2 {
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📶 Website Traffic Analyzer</h2>
        <form action="/analyze" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload & Analyze</button>
        </form>
    </div>
</body>
</html>
